# Production-like local stack: PostgreSQL + FastAPI backend + nginx-served frontend.
#   cp backend/.env.example backend/.env   # set SECRET_KEY (and POSTGRES_PASSWORD below)
#   docker compose up --build
# Open http://localhost:8080 (API docs: http://localhost:8080/api/... is proxied; /docs on :8000)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow -d focusflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://focusflow:${POSTGRES_PASSWORD}@db:5432/focusflow
      CORS_ORIGINS: http://localhost:8080
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend-logs:/app/logs

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  backend-logs:
